# StockHome runtime contract
#
# 本ファイルは vps-server-management の runtime_contract_and_intake_v1.md §3 が定義する
# schema v1 に従う。値が不明な項目は推測で埋めず null のままにする（同文書の方針）。
#
# 更新履歴:
#   2026-08-31 (task_id: 20260831-004): logging セクションのみで新規作成
#   2026-09-01: VPS管理側の再review（notice_id: 20260831-STOCKHOME-001、
#     2026-09-01 StockHome 再review、blocker 4）を受け、Claudeが対話セッションで
#     全体schema（runtime/network/config/data/jobs/dependencies/deploy/user_impact）へ拡張。
#     初版はrepository内の正本とローカルDocker環境だけに基づいて作成した。
#   2026-09-01: VPS管理側がproduction反映後にruntime、network、health、volume、loggingを実機照合。
#   2026-09-02 (task_id: 20260902-001): container起動時のPrisma CLI/npm非JSON出力を
#     entrypoint化で解消。logging.format/schema_versionを実測に基づき更新。
#   2026-09-02 (task_id: 20260902-003): production反映後、起動ログ全行のJSON parse、
#     migration成功、health、bridge、bind、DB image/volume不変をVPS管理側が確認。
#   2026-09-02 (task_id: 20260902-006): プッシュ通知の追加に伴い dependencies.external を
#     [] から Expo Push Service へ更新（本APIから初の外向き通信）。data に push_devices
#     テーブル追加を記録。production未反映（notice 20260902-STOCKHOME-004 で承認待ち）。

schema_version: 1
app: stockhome

canonical_repo: https://github.com/soushinyamaoka/StockHome.git
canonical_ref: main
updated_at: 2026-09-02
verified_against_runtime: 2026-09-02

runtime:
  type: docker-compose
  unit: api                       # docker-compose.prod.yml のservice名
  working_directory: /app/apps/api  # apps/api/Dockerfile runtimeステージの WORKDIR
  user: root                      # apps/api/Dockerfile に USER 指定がなく、ベースイメージ既定のまま（明示的な非rootユーザーへの切り替えなし）
  group: null
  language_runtime: node:20-bookworm-slim  # apps/api/Dockerfile FROM
  os_packages: [openssl]           # Prismaのクエリエンジンが必要とするため apt-get install
  restart_policy: unless-stopped   # docker-compose.prod.yml api/postgres 両サービス共通

network:
  listeners:
    - bind: 0.0.0.0                # コンテナ内部でのbind（HOST環境変数未設定のためserver.tsの既定値）
      port: 4002
      protocol: http
      # ホスト側の公開範囲は docker-compose.prod.yml の port mapping "127.0.0.1:4002:4002" で
      # 127.0.0.1 のみに制限している（ホスト外部からの直接到達を遮断。CLAUDE.mdのコミット履歴に記載）。
  public:
    - url: https://stockhome.homehub-tools.dedyn.io
      upstream: 127.0.0.1:4002
      tls: letsencrypt
  health:
    internal:
      path: /health
      expected_status: 200
      auth_required: false
    public:
      path: /health
      expected_status: 200

config:
  env_file: .env                  # リポジトリルート。docker composeの変数展開（${POSTGRES_USER}等）に使われる。値はコミットしない
  env_vars:
    - { name: NODE_ENV, required: true, secret: false }
    - { name: TZ, required: true, secret: false }
    - { name: PORT, required: true, secret: false }
    - { name: DATABASE_URL, required: true, secret: true }
    - { name: JWT_SECRET, required: true, secret: true }
    - { name: BRIDGE_TOKEN, required: true, secret: true }
    - { name: POSTGRES_USER, required: true, secret: true }
    - { name: POSTGRES_PASSWORD, required: true, secret: true }
    - { name: POSTGRES_DB, required: true, secret: false }
  secret_provisioning: manual     # .env.production.example を cp して手動設定（README記載）

data:
  databases:
    - { engine: postgres, version: 16, name: null }  # イメージは postgres:16-alpine。DB名はPOSTGRES_DB（値は秘匿のため未記載）
  persistent_paths:
    - path: /var/lib/postgresql/data  # container内のmount先。実機named volumeはstockhome_stockhome_pgdata
      backup_required: true
      regenerable: false
  migrations: automatic            # apps/api/Dockerfile の CMD が起動の都度 `prisma migrate deploy` を実行する
                                    # 未適用: 20260902073443_add_push_devices（push_devices テーブルの新規作成のみ。
                                    # CREATE TABLE + index + 外部キーだけで、既存テーブルの変更・データ操作を含まない。
                                    # ローカルDBで適用・動作確認済み。production は notice 20260902-STOCKHOME-004 の承認後に反映される）

jobs:
  - name: daily_batch
    mechanism: in-process           # OS cron/systemd-timerではなく、Node.jsプロセス内蔵の node-cron によるスケジューリング（schema既定の enum: cron|systemd-timer とは異なる実態のため、ありのまま記録）
    definition: apps/api/src/server.ts 内の node-cron スケジュール定義（コード内。OS側のcron/timerファイルは無い）
    schedule: "55 19 * * *"        # JST（node-cron の timezone: 'Asia/Tokyo' 指定）
    success_signal: >-
      構造化ログの event: job_start と job_end（同一 run_id）の対で判定できる。
      job_end.status が success/failure、job_start はあるが job_end が無ければ異常終了、
      予定時刻に job_start が無ければ未実行、と区別できる（task_id: 20260831-004 で実装、動的確認済み）。

dependencies:
  internal: []                     # 内部API依存なし（確認済み）
  external:                        # GAS（Gmail取込・ReadyGo通知）はGAS側からのアウトバウンドで本APIを呼ぶ関係であり、本APIからの外部依存ではない
    - name: expo-push-service
      url: https://exp.host/--/api/v2/push/send
      direction: outbound          # APIコンテナ → インターネット（HTTPS）
      used_by: daily_batch         # 夜間バッチ(19:55 JST)が「新たに在庫アラートになった品目」を検知したときのみ送信。リクエスト毎の呼び出しは無い
      auth: none                   # Expo Push Token（端末が発行する送信先識別子）を本文に載せるのみ。APIキー・secretは使用しない
      failure_mode: non-blocking   # 送信失敗・タイムアウト・到達不能はwarnログ(push_send_failed)を出して継続し、バッチ全体を失敗させない（動的確認済み: task_id 20260902-006）
      data_sent: >-
        通知タイトル・本文（在庫アラート対象の品目名と残日数・残数）と、宛先のExpo Push Token。
        認証情報・購入履歴・メールアドレス・世帯識別子は送らない。
        利用者が「品目名を含める」方針を選択済み（2026-09-02）。

deploy:
  entry: npm run deploy（scripts/deploy.ps1）  # tar化 → scp → VPS上で docker compose -f docker-compose.prod.yml up -d --build api → /health ポーリング確認
  downtime: brief-restart          # api コンテナのみ再ビルド・入れ替え。postgresコンテナ・DBデータは変更しない
  rollback: >-
    正式なversioned releaseは未整備。2026-09-01のtask 20260901-001では、実行前に現行source archive、
    PostgreSQL論理dump、旧API image tagを作成し、size、gzip整合、SHA-256を確認した。task 20260901-002では、
    DB/schema/data変更がないためDB dumpを省略し、現行source archiveと旧API image tagを保全した。
    health失敗時は旧image tagをCompose overrideで起動し、成立しない場合は旧source archiveを
    別directoryへ展開して同じCompose project名で再buildする。DB schema変更はないため、通常rollbackで
    DB restoreは行わない。詳細はvps-server-managementのtask 20260901-001 / 20260901-002実行記録を正本とする。

logging:
  destinations: [stdout]     # Docker Compose (docker-compose.prod.yml) の logging driver が収集する。アプリ独自のログファイルは無い
  format: structured          # container起動シーケンス全体を含め1行1JSONに統一済み（task_id: 20260902-001）。
                              # apps/api/Dockerfile の CMD を `node dist/entrypoint.js` へ変更し、
                              # apps/api/src/entrypoint.ts がPrisma CLI（migrate deploy）を子processとして
                              # 実行、生のstdout/stderrはログへ出さず、migration_start/migration_end
                              # （失敗時はprisma_error_codeのみ）へ変換する。成功時のみdist/server.jsを
                              # 子processとして起動し、SIGTERM/SIGINTを転送する。ローカルでDockerイメージを
                              # 実際にbuildし、成功系・失敗系・`docker stop`によるSIGTERM転送（shutdown
                              # イベントの実出力を確認）のすべてで全出力行がJSON.parse可能であることを確認済み。
  schema_version: 1           # 共通ログ規約v1準拠。container全体のstdout/stderrが1行1JSONになったことを実機（ローカルDocker）で確認済み
                              # 2026-09-02のproduction反映後、起動ログ7行すべてのJSON parse成功、必須field、migration成功を確認済み
  contains_pii: false         # 実装済みの全ログ呼び出し箇所をコードレビュー・動的確認で検証: password/token/APIキー/メール本文・アドレス/メッセージID/品目名/query文字列付きURL/リクエスト・レスポンスボディを渡していない。
                              # DBエラー（Prismaエラー）はHTTPエラーハンドラで name/code のみをログへ渡し、5xxレスポンスも汎用メッセージのみを返す（task_id: 20260831-006、動的確認済み）。
                              # Prismaクライアント自身のerror/warnイベントもtarget（内部コンポーネント名）のみを渡し、message/metaは渡さない（task_id: 20260831-008、動的確認済み）。
                              # DBエラー以外（Fastify組み込み・JWT・予期しない例外）も含め、全てのエラーログ呼び出し箇所（server.ts/
                              # candidateIntake.ts/bridge.ts）を共通の許可リスト変換 safeErr()（name/文字列型codeのみ）へ統一済み
                              # （task_id: 20260831-010）。利用者値（メールアドレス・パスワード等）を含むError/非Errorでの
                              # 非混入を直接検証・実機のDB停止状態での検証の両方で確認済み。
  rotation: null              # アプリ側でローテーションを持たない（Docker/OS側に委ねる）

user_impact:
  direct_users: true           # 家庭内の利用者がモバイルアプリから直接使う
  client_apps: [stockhome-mobile]
  user_facing_functions: ["購入登録", "在庫予測", "在庫アラート通知（ReadyGo経由）"]

# 既知の未解決事項（隠さずそのまま記録する）
known_gaps:
  - >-
    正式なイメージバージョン管理・ロールバック手順が未整備（deploy.rollback参照）。暫定手順は記載済みだが、
    正式な仕組み（タグ付きイメージ保持等）は別途整備が必要。
  - >-
    OPS-P1-08のPhase Aで解消可能なdependencyを更新した後も、node-cron 3.0.3 / uuid 8.3.2のmoderateと、
    xlsx 0.18.5のhighが残る。現構成での到達可能性は低いが、node-cron major update、xlsxの期限付き
    リスク受容・代替library化・runtime imageからのdevDependencies除外を個別に判断する必要がある。

# 2026-08-31〜09-02 時点で解消済みの事項
resolved_gaps:
  - >-
    task_id: 20260902-001 のローカルDocker検証で、正常起動中のcontainerへ`docker stop`による
    Linux SIGTERMを送り、serverの`shutdown`イベント出力、終了コード0、SIGKILL猶予前の正常終了を
    確認した。従来known_gapsに記録していたWindows開発環境由来のSIGTERM動的確認不足は解消済み。
  - >-
    task_id: 20260902-001 で解消。コンテナ起動時にPrisma CLI（`prisma migrate deploy`）・npmが
    出していた非JSON出力（1行1JSON MUST違反、`logging.format: plain`/`schema_version: null`の原因）を
    解消した。`apps/api/Dockerfile`のCMDを`node dist/entrypoint.js`へ変更し、新設した
    `apps/api/src/entrypoint.ts`がmigrationを子processとして実行して`migration_start`/
    `migration_end`（失敗時は`prisma_error_code`のみ、生出力は渡さない）へ変換し、成功時のみ
    `dist/server.js`（無変更）を子processとして起動、SIGTERM/SIGINTを転送する。ローカルで
    Dockerイメージを実際にbuildし、成功系（migration 3件・`startup`・`http_request`まで全行JSON、
    query文字列非漏洩）、失敗系（DB接続不可でP1001、`server`未起動、コンテナ非0終了、
    パスワード等の非混入）、`docker stop`によるSIGTERM転送（`shutdown`イベント実出力、
    正常終了コード0）のすべてを実機確認済み。
  - >-
    task_id: 20260901-002 でOPS-P1-08 Phase Aをproduction反映。esbuild 0.28.2、fast-uri 3.1.6、
    find-my-way 9.9.0をruntime image内で確認し、API/shared scopeのnpm auditを6件から3件へ削減した。
    API/DB、health、bind、volume、logを検証し、DB/schema/data変更がないことを確認した。
  - >-
    2026-09-01にVPS管理側がproduction実機を照合し、public URL、TLS、public health、loopback PortBinding、
    DB volume、runtime、health、loggingの現在値を確認した。verified_against_runtimeを同日へ更新した。
  - >-
    task_id: 20260831-005 で解消。Fastifyの listen() が内部的に出す "Server listening at <address>"
    （bind先アドレスごと、event: "unclassified" になっていた）を、listen()前後だけ logger level を
    一時的に silent にすることで抑制した。再起動して unclassified ログが0件になったことを確認済み。
  - >-
    task_id: 20260831-006 で解消。自動セキュリティレビューで、HTTPエラーハンドラが
    Prismaエラーの message をログとレスポンスへそのまま渡していた問題（DB制約違反等で
    利用者由来の値が漏洩し得た）を発見。DBエラーはログへ name/code のみ、5xxレスポンスは
    常に汎用メッセージのみを返すよう修正し、DB停止状態での実機確認で解消を確認済み。
  - >-
    task_id: 20260831-008 で解消。Prismaクライアント自身の内部ログが pino を経由せず
    非JSONで直接stdoutへ出力されていた問題（1行1JSON MUST違反）を発見。event購読方式へ
    変更し、target（安全な内部コンポーネント名）のみをpino経由で構造化ログ化した。
    合わせて、夜間バッチ失敗時に原因情報が皆無だった点も、安全な範囲（error_name/error_code）
    のみ job_end へ追加する形で解消。いずれもDB停止状態での実機確認で解消を確認済み。
  - >-
    task_id: 20260831-009 で解消。上記008の db_client_log 出力で、pino自動付与の level と
    手動付与の level フィールドが重複していた冗長な記述を削除。実機確認でキー重複が
    無くなったことを確認済み。
  - >-
    task_id: 20260831-010 で解消。server.ts の non-DB error、candidateIntake.ts、bridge.ts の
    raw Error を pino へ渡していた問題を、共通の safeErr()（name/文字列型codeのみ）へ統一した。
    利用者値を含むError/非Errorでの非混入をローカルで直接検証し、DB停止状態での実機確認でも
    メールアドレス等が漏れないことを確認済み（VPS管理側の2026-09-01再review blocker 2への対応）。
