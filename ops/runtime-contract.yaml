#     data.data_retentionへ記載）。コード変更は無い（方針決定・記録のみ）。
#     Claude直接作業。production未反映（記録の反映のみのためdeploy不要）。
#   2026-09-20 (task 20260920-013): 所見C-8（npm audit残件・runtime image肥大化）・
#     A-9（mobile平文HTTP全面許可）へ対応し、notice 20260920-STOCKHOME-017を作成した。
#     fastify更新・Dockerfileのruntime image slim化・prismaの依存分類修正はClaudeが
#     直接検証・commit（依存更新はCLAUDE.mdの例外規定）。known_gaps/resolved_gapsを
#     更新し、対応完了に伴いops/investigations/OPS-P1-08-npm-audit-findings.mdを削除した
#     （ファイル自身の指示どおり）。production未反映。
#   2026-09-20 (task 20260920-009/010): 所見C-3（バッチ失敗が誰にも届かない）へ対応し、
#     notice 20260920-STOCKHOME-015を作成した。新規テーブルbatch_run_statusを追加
#     （migration 20260920210514_add_batch_run_status）、data.field_semanticsへ記載。
#     GET /api/dashboard へ lastBatchRun を追加。migration生成はCodexの実行環境に
#     DATABASE_URLが無くblockedとなったため、Claudeがローカル開発DBで生成・適用・
#     全148テスト・end-to-end確認を行い、確定内容をCodexへ渡してcommitした
#     （task 20260920-010）。production未反映。
#   2026-09-20 (task 20260920-007/008): 所見A-5・A-6（手動バッチによるLINE二重配信、
#     ReadyGoキューの滞留・保持方針未定義）へ対応し、notice 20260920-STOCKHOME-014を作成した。
#     data.data_retentionへ readygo_outbox の項目を追加（pendingの置き換え、delivered 30日、
#     滞留メトリクス4field）。jobs.daily_batchの処理内容が変わるが、schedule・schema・
#     migrationに変更はない。production未反映。
#   2026-09-20 (第2回VPS管理レビュー): notice 20260920-STOCKHOME-013の第2回レビューで、
#     コードblockerは解消済み・Nginx変更も不要と判定されたうえで、文書側4点の訂正指示を
#     受けた。TRUSTED_PROXY_IPSをrequired: falseからrequired: trueへ訂正（productionでは
#     明示設定が前提であることを反映）、接続元IP実測172.19.0.1を単に「解決済み」で統一、
#     nginxの転送ヘッダ仕様の説明を「XFF上書き」という不正確な表現から「追記方式＋
#     直前proxy限定trust」（X-Real-IPは上書き、X-Forwarded-Forは追記で上書きではない）
#     へ訂正した。Claudeが本ファイルへ反映。production未反映。
#   2026-09-19 (commit 12ac1a5の再レビュー): VPS管理側が方針本文の整合を確認（local
#     HEAD・cached origin/main・実remote mainがcommit一致、変更はruntime-contract.yaml
#     への15行追加のみでbuild input変更なし、YAML parse成功、backup_policyの内容が
#     方針・実機確認結果と一致）。軽微な訂正2点を反映した: (1) 本ファイルを2026-09-19に
#     更新したためtop-level updated_at/verified_against_runtimeを2026-09-19へ更新、
#     (2) NASのsnapshot設定・実行主体を「VPS管理側で別途実施」から「NAS UIへアクセス
#     する運用者が実行し、VPS管理側は方針管理と結果確認・記録を担当」という正しい
#     分担へ訂正し、恒久記録先（VPS管理repoのstockhome_backup_and_rollback_decision_
#     20260919.md・backup_restore_drill_log.md）を明記した。訂正commitも文書更新のみで
#     server change notice・production承認は不要（VPS管理側判定）。
#   2026-09-20〜09-21 (notice 20260920-STOCKHOME-014、所見A-5・A-6のVPS管理レビュー
#     4ラウンド、task 20260920-015・20260921-001/003、GAS側task 20260921-004/005):
#     初回実装（pendingの単純な置き換え削除→insert）に対し、第1回レビューで並行batchと
#     GAS fetch/ACKの競合（S014-B01・B02）を指摘され、readygo_outboxをpending→claimed→
#     deliveredの3状態＋partial unique indexへ再設計した。第2回レビューでさらに、
#     並行claimの二重取得（S014-B03、`FOR UPDATE SKIP LOCKED`＋status再確認で解消）、
#     既存重複を含む状態でのmigration失敗（S014-B04、migration内でのDELETE整理で解消）、
#     未ACK claimedの永久滞留（S014-B05、30分leaseでの回収で解消）を指摘され対応した。
#     第3回レビューで、lease回収処理がdaily_batchの並行insertと競合すると未処理の
#     一意制約違反で500になる問題（S014-B06、household単位の楽観的update＋P2002捕捉時
#     フォールバックdeleteへ変更して解消）と、GAS側でACK不達時に同じ内容がReadyGo
#     Inboxへ二重投入されうる問題（S014-B07、GAS側`ApiBridge.js`へScript Properties
#     ベースの配信済みid記録・TTL 7日を追加）を指摘され対応した。第4回レビューで、
#     このS014-B07対応が「Inbox投入とID記録が別操作のため中断時に二重投入しうる」と
#     部分対応の指摘を受け、ReadyGo Inboxシートへ列E（`stockhome_outbox_id`）を追加し
#     本文と同じ`appendRow`呼び出しでidを同時書き込みする方式へ置き換えた（旧Script
#     Properties方式は削除）。あわせて`deliverStockHomeNotifications`全体を
#     `LockService`で排他し並行実行対策も追加した。data.data_retentionの
#     readygo_outbox項目(4)lease回収の説明も、S014-B06が「判定してから実行」方式から
#     「楽観的実行＋一意制約違反時フォールバック」方式へ変更したことを反映するよう
#     訂正した（第4回レビューで記載矛盾を指摘され対応）。GAS側の冪等化（Inbox列Eでの
#     照合）はAPI側DBに影響しないため、data.data_retentionへは詳細を記載しない。
#     schema変更はAPI側がclaimed_at列＋partial unique index追加のみ（migration
#     20260920222509）。ReadyGo Inbox側の列E追加はGAS側スプレッドシートの変更であり
#     本ファイルが対象とするAPI/DBのschemaではない。production未反映。

schema_version: 1
app: stockhome

canonical_repo: https://github.com/soushinyamaoka/StockHome.git
canonical_ref: main
updated_at: 2026-09-20
verified_against_runtime: 2026-09-19  # backup_policy追加分をVPS管理側が2026-09-19の再レビューで
  # 実機・証跡と照合済み（VPS内03:00 pg_dump 14世代、NAS 03:30 pull、snapshot 04:00・
  # 日次7/週次4/月次12、2026-09-19隔離復元結果、NAS側設定未確認の記載、いずれも一致）。
  # それ以前の項目はVPS task 20260915-002（結合API反映後の即時検証と19:55/20:10自然実行確認）のまま。

runtime:
  type: docker-compose
  unit: api                       # docker-compose.prod.yml のservice名
  working_directory: /app/apps/api  # apps/api/Dockerfile runtimeステージの WORKDIR
  user: root                      # apps/api/Dockerfile に USER 指定がなく、ベースイメージ既定のまま（明示的な非rootユーザーへの切り替えなし）
  group: null
  language_runtime: node:20-bookworm-slim  # apps/api/Dockerfile FROM
  os_packages: [openssl]           # Prismaのクエリエンジンが必要とするため apt-get install
  restart_policy: unless-stopped   # docker-compose.prod.yml api/postgres 両サービス共通

network:
  listeners:
    - bind: 0.0.0.0                # コンテナ内部でのbind（HOST環境変数未設定のためserver.tsの既定値）
      port: 4002
      protocol: http
      # ホスト側の公開範囲は docker-compose.prod.yml の port mapping "127.0.0.1:4002:4002" で
      # 127.0.0.1 のみに制限している（ホスト外部からの直接到達を遮断。CLAUDE.mdのコミット履歴に記載）。
  public:
    - url: https://stockhome.homehub-tools.dedyn.io
      upstream: 127.0.0.1:4002
      tls: letsencrypt
      # nginxの転送ヘッダ仕様（VPS管理側確認、notice 20260920-STOCKHOME-013）:
      # 現行は「追記方式＋直前proxy限定trust」の設計。X-Real-IP は接続元IPで上書きするが、
      # X-Forwarded-For は受信値の末尾へ接続元IPを追記する（上書きではない。クライアントの
      # 詐称値は保持されたまま残るが、末尾に本当の接続元IPが必ず追加される）。
      # このためAPI側は trustProxy:true を使わず、TRUSTED_PROXY_IPS（直前proxyのみ、
      # 実測 172.19.0.1）を信頼するよう構成している。Fastify(proxy-addr)はXFFを右から
      # 左へ走査し最初の非信頼値を採用するため、nginxが末尾に追記した本当の接続元IPが
      # 正しく採用され、クライアント側の詐称prefixは信頼されない。
  health:
    internal:
      path: /health
      expected_status: 200
      auth_required: false
    public:
      path: /health
      expected_status: 200

config:
  env_file: .env                  # リポジトリルート。docker composeの変数展開（${POSTGRES_USER}等）に使われる。値はコミットしない
  env_vars:
    - { name: NODE_ENV, required: true, secret: false }
    - { name: TZ, required: true, secret: false }
    - { name: PORT, required: true, secret: false }
    - { name: DATABASE_URL, required: true, secret: true }
    - { name: JWT_SECRET, required: true, secret: true }
    - { name: BRIDGE_TOKEN, required: true, secret: true }
    - { name: POSTGRES_USER, required: true, secret: true }
    - { name: POSTGRES_PASSWORD, required: true, secret: true }
    - { name: POSTGRES_DB, required: true, secret: false }
    - { name: TRUSTED_PROXY_IPS, required: true, secret: false }
      # notice 20260920-STOCKHOME-013（所見A-8）。server.ts の resolveTrustedProxies が
      # Fastifyのtrust proxyへ渡す、直前proxy（nginx）のIPのカンマ区切りリスト。
      # VPS管理側が2026-09-20に実測した値は 172.19.0.1（stockhome_default networkの
      # gateway IP、解決済み）。docker-compose.prod.ymlのapi.environmentへ渡し、.envへ
      # TRUSTED_PROXY_IPS=172.19.0.1 を設定することがdeploy前提（本番運用ではrequired）。
      # コード側の既定値 127.0.0.1,::1 はnginx→APIコンテナ間のDocker bridge network経由の
      # 実接続元とは一致しないfallbackのため、production deployでは明示設定を必須とする。
      # Docker bridge networkの再作成等でgateway IPが変わった場合はVPS管理側で再測定が必要。
    - { name: HISTORICAL_REPARSE_ENABLED, required: false, secret: false }
      # notice 20260907-STOCKHOME-006。'true'のときだけ GET/POST /api/bridge/reparse-candidates・
      # GET /api/bridge/reparse-progress を有効化する一時フラグ（未設定時は404）。
      # 対応するAPI code・4 migrationはtask 20260912-001で2026-09-12にproduction反映済みだが、
      # このフラグ自体はtrueに設定していない（新設routeはbridge認証後も404を返し機能上は無効）。
      # docker-compose.prod.ymlのapp.environmentへの受け渡し追加はtask 20260907-004で対応済み。
      # runToken自体は環境変数ではなくAPI呼び出し側が専用header（X-Reparse-Run-Token）で渡す
      # （第3回レビューB03対応、task 20260907-005）
  secret_provisioning: manual     # .env.production.example を cp して手動設定（README記載）

data:
  databases:
    - { engine: postgres, version: 16, name: null }  # イメージは postgres:16-alpine。DB名はPOSTGRES_DB（値は秘匿のため未記載）
  persistent_paths:
    - path: /var/lib/postgresql/data  # container内のmount先。実機named volumeはstockhome_stockhome_pgdata
      backup_required: true
      regenerable: false
      backup_policy: >-
        2026-09-19、VPS管理側が方針決定・実施。所有（日次取得・世代管理・復元手順）は
        VPS管理側。VPS内: 毎日03:00にpg_dump、14世代保持。外部: 毎日03:30に
        UGREEN NASへread-only pull。NAS側snapshot: 04:00取得、日次7・週次4・月次12世代。
        復元試験: 2026-09-19 03:00時点の最新dumpを隔離PostgreSQL 16へ復元し、19テーブル・
        invalid index 0・試験用container/volume/network残存0を確認済み（production
        API/DBはrestart 0・health 200のまま、production側への影響なし）。
        記録先はVPS管理側の受理台帳・VPS管理レビュー、および
        docs/operations/stockhome_backup_and_rollback_decision_20260919.md・
        docs/operations/backup_restore_drill_log.md（いずれもVPS管理repo）。
        NASのsnapshot設定・実行はNAS UIへアクセスする運用者が行い、VPS管理側は
        方針管理と結果確認・記録を担当する（2026-09-19時点でNAS側snapshot設定の
        実機確認は未完了）。
  migrations: automatic            # entrypointが起動の都度 `prisma migrate deploy` を実行する。
                                    # 2026-09-05のproduction実機では5 migration適用済み・up to date。
                                    # task 20260905-001はschema/migration変更なし。
  field_semantics:
    - table: batch_run_status
      fields: [job_name, status, run_id, ran_at, duration_ms, error_name]
      meaning: >-
        2026-09-20（notice 20260920-STOCKHOME-015、所見C-3、production未反映）追加。
        夜間バッチ(daily_batch)のcron実行（householdId未指定）の直近1回の結果だけを
        保持する単純なstatusテーブル。job_name（値は常に'daily_batch'）に一意制約が
        あり、常に1行のみ存在する（upsert）。手動実行（管理者が検証用に押す
        POST /api/dashboard/run-batch、householdId指定）はこのテーブルを更新しない。
        GET /api/dashboard のlastBatchRunフィールドとしてmobileへ公開し、失敗時
        または前回成功から26時間超過時にダッシュボードへ警告バナーを表示する
        （通知経路の追加ではなくアプリ内表示のみ、というapp ownerとの合意による）。
      update_paths: >-
        apps/api/src/services/batch.ts の runDailyBatch の finally節でのみ更新する
        （cron実行時のみ）。記録自体の失敗はtry/catchで握りつぶし、job_endログや
        バッチ本体の成否には一切影響しない。
      failure_consistency: >-
        該当なし（運用状態の表示専用で、業務データではない）。記録が失敗・欠落しても
        次回cron実行（翌日19:55 JST）で上書きされ、実害はない。
    - table: item_runtime_states
      fields: [manual_override_qty, manual_override_at, manual_override_by_user_id, manual_override_reason]
      meaning: >-
        2026-09-05（notice 20260904-STOCKHOME-005、task 20260905-001でproduction反映）以降、
        この4フィールドは
        「買い足し累積」の書き込み先を兼ねる。従来は利用者が明示的に行う在庫補正（在庫補正画面、
        manual_override_reason は CORRECTION_REASONS 列挙値）専用だったが、追加で
        手動購入登録・Gmail取込確定・夜間バッチのcounted化のいずれかが起きるたびに、
        「直前の推定残数＋今回の購入数」で上書きされる（manual_override_reason は
        purchase_accumulated / purchase_accumulated_gmail / purchase_accumulated_batch の
        いずれか。プレフィックス purchase_accumulated で判定可能）。
      update_paths: >-
        (1) POST /api/purchases（手動購入登録）、(2) candidateIntake.createPurchaseLogFromCandidate
        （Gmail取込の自動/手動確定）、(3) 夜間バッチ内 updateCountedInInventory
        （配送バッファ設定等でcounted化が遅延した購入の遅延反映）、(4) 在庫補正
        （POST /api/corrections、従来からの経路、reasonはCORRECTION_REASONS）。
        (1)〜(3) は品目行（items）を SELECT ... FOR UPDATE でロックしてから
        「読み取り→積み上げ→書き込み」を行い、購入行の作成/counted化と同一トランザクションに
        包む（VPS管理レビューB01対応）。DELETE /api/purchases（購入取消）は、取消対象が
        積み上げ由来（reasonがpurchase_accumulated*）であれば同量を差し引く簡易差し戻しを行う
        （完全な巻き戻しではない。stockCalc.tsのreverseAccumulatedPurchase参照）。
      failure_consistency: >-
        購入行の作成・counted化と積み上げ書き込みは同一トランザクション内で行うため、
        一方だけが確定することはない（途中失敗時は両方ロールバックされ、次回のバッチ実行や
        利用者の再操作で安全に再試行できる）。夜間batchの二重起動時も、品目行ロック取得後に
        DB上の最新状態を再確認し、その時点でなお未countedの行だけを処理するため二重加算しない
        （VPS管理レビューB07対応、2026-09-05）。node:testで同時実行・途中失敗・再実行・
        batch二重起動・JST日付境界（固定日時）の各シナリオを再現確認済み
        （apps/api/src/services/stockCalc.accumulation.test.ts、16件）。
      rollback_caveat: >-
        API imageのrollbackは、rollback後に発生する新規購入の計算方式を旧方式（上書き）へ
        戻すのみで、rollback**前**に新方式が既に書き込んだ manual_override_qty の値
        （積み上げ後の値）は自動的には元へ戻らない。旧imageはこのカラムを同じ数値カラムとして
        問題なく読める（クラッシュ・データ破損はない）が、値そのものの巻き戻しにはDB restore
        または個別データ補正が必要（notice 20260904-STOCKHOME-005のDeploy・rollback節を参照）。
    - endpoint: GET /api/items/:itemId/purchases
      change: >-
        レスポンスへ suggestedDaysPerUnit（{value, sampleCount} | null。直近の購入間隔から
        算出した消費ペースの目安）を追加。既存フィールド（purchases, priceStats）は不変で、
        旧クライアントとの後方互換性を維持する。
    - table: import_order_candidates
      fields: [price_source]
      meaning: >-
        2026-09-06（task 20260906-001）追加。検出価格の根拠ラベル（GASパーサーが付与）。
        '本体価格'のみ、数量に関わらず単価そのものとして即時確定してよい根拠として扱う
        （candidateIntake.ts の CERTAIN_UNIT_PRICE_SOURCES）。それ以外の値・NULLは
        単価/小計を判別できないものとして扱う（layer1では確定しない）。
      update_paths: >-
        GASブリッジ（POST /api/bridge/import-candidates）からの新規候補作成・upgrade時。
        notice 20260907-STOCKHOME-006の再解析route（未production反映、下記参照）でも
        NULL→値の一方向でのみ更新する。
      failure_consistency: 通常の候補作成と同一のトランザクション内で設定される。単独では更新しない。
    - table: price_reparse_runs
      fields: [run_token, imported_by_email, household_id, cutoff_at, expires_at, revoked_at]
      meaning: >-
        2026-09-07（notice 20260907-STOCKHOME-006、task 20260907-004で追加、
        task 20260912-001で2026-09-12にproduction反映済み。schemaのみで0 row、
        機能フラグ未設定のため同時点ではHTTP経由の利用は未発生）。現在はtask
        20260914-001/002で計5runを作成・全失効済み。過去候補の単価
        再解析APIへの認可専用テーブル。GAS側の
        呼び出しを、この事前発行済みrun_tokenが指すimported_by_email・household_idの
        候補だけに限定する（共有BRIDGE_TOKEN保持者が任意のemailを自己申告して
        他利用者のGmail message ID・商品名へアクセスすることを防ぐ）。行の作成は
        HTTP経由では行わず、production承認後に運用者がローカル/VPS上で直接1件だけ
        発行する（createReparseRun関数）。task 20260914-002では個別承認された運用helperで
        検証済みsubset49/144件だけのrunをSERIALIZABLE transaction内に作成した。cutoff_atは
        run作成時刻（第3回レビューB02/B04対応、task 20260907-005で追加）で、
        この時刻より後に作成された候補（通常の6時間取込等）はこのrunの対象に含めない
        （対象集合をrun作成時点で固定し、動的に増減しないようにする）。
        createReparseRunは、「同一household_idで未失効・未期限切れのrunが無いか確認」
        「run作成」「対象manifest（price_reparse_targets）書き込み」をSERIALIZABLE
        isolationのtransactionへ統合し、Postgresが書き込みskewを検出した場合
        （P2034）は最大3回まで再試行する（第4回レビューR4-03、第5回レビューR5-03対応。
        以前はfindFirst→createの2queryだけで、真の同時実行に対する防御が無かった。
        既存runを差し替える場合は運用者が先にrevoked_atを設定する）。
        run/chunkの進捗（対象数・処理済み数・残数・完了判定）は、getReparseRunProgress
        関数がprice_reparse_targets（第5回レビューR5-02対応で追加した固定manifest）と
        price_reparse_auditのmode='write'行から都度導出する。findActiveRunではなく
        失効判定をしないfindRunByTokenを使うため、GAS側のcursor等local stateが
        失われた場合や、runが期限切れ・失効した後でも、この関数（および
        `GET /api/bridge/reparse-progress`route）だけで進捗をDBから復元できる。
        **期限切れ（revoked_atが未設定のままexpires_atだけが過去）のrunだけを、
        extendReparseRun関数で同一household向けの他の有効runが無いことを確認した
        うえでexpires_atを延長し、同じrunToken・manifest・監査履歴を維持したまま
        再開できる。失効済み（revoked_atが設定済み）のrunはextendReparseRunでは
        絶対に扱わない（第7回レビューR7-01対応。以前はrevoked_atの状態を確認せず
        失効runも同じ関数で再有効化できてしまい、token漏えい・誤配布・緊急停止時の
        無効化を延長操作自体で覆せてしまう欠陥があった）。**
        失効済みのrunを再開したい場合はrotateReparseRunToken関数を使う。こちらは
        revoked_atが設定済みのrunにのみ適用でき、暗号学的乱数で生成した新しい
        runTokenへrun_token列自体をUPDATEで書き換え、revoked_atをクリアして
        expires_atを再設定する。旧runTokenはDB上に一致する行が無くなるため、
        以後`ReparseRunInvalidError`で永久に拒否される（同一household向けの他の
        有効runが無いことの確認、SERIALIZABLE transaction・P2034リトライは
        extendReparseRunと共通のヘルパーを使う）。いずれもHTTP非公開の運用者向け関数。
      update_paths: >-
        手動発行のみ（HTTP経由の作成route無し）。revoked_atの設定も手動想定
        （rotateReparseRunTokenによるクリアを除く）。cutoff_atはcreateReparseRun実行時に
        自動設定され、以後変更しない。expires_atはcreateReparseRun実行時に自動設定され、
        以後extendReparseRunまたはrotateReparseRunTokenでのみ更新される。run_tokenは
        rotateReparseRunTokenでのみ変更される。task 20260914-002の限定run作成は
        個別承認された運用helperで行い、旧runの再有効化/期限延長/token変更はしていない。
      failure_consistency: >-
        該当なし（認可専用、業務データではない）。ただしcreateReparseRunの
        SERIALIZABLE transactionはrun作成とprice_reparse_targetsへの書き込みを
        アトミックに行うため、一方だけが確定することはない。
    - table: price_reparse_targets
      fields: [run_id, candidate_id]
      meaning: >-
        2026-09-08（notice 20260907-STOCKHOME-006、task 20260907-007で追加、
        task 20260912-001で2026-09-12にproduction反映済み。同時点はschemaのみで0 row）。
        現在はtask 20260914-001/002の計599targetを保持する。
        createReparseRun実行時点で対象となる候補ID一覧を
        固定するmanifest（第5回レビューR5-02対応）。run作成後に他経路
        （通常のGmail確定フロー等）で候補の価格が確定しても、このmanifestの
        内容は不変である。**第6回レビューR6-02対応（task 20260907-008）で、
        本テーブルはgetReparseRunProgressの分母（totalTargets）だけでなく、
        GET /reparse-candidates（getReparseTargets）とPOST /reparse-candidates
        （computeOutcome）双方の正本になった。** GETはこのmanifestのうち
        mode='write'監査がまだ無い候補だけを返し、POSTは受信candidateIdが
        このmanifestのメンバーでなければ（household/owner/cutoffが一致していても）
        candidate_not_in_manifestとして拒否しdata・auditとも不変のconflictにする。
        以前（第5回まで）はGETが動的な「price_source IS NULL」等の条件だけに依存し、
        POSTにはメンバーシップ確認が無かったため、(a) run開始後に外部要因で価格確定
        した対象がGETから消えて完了させられない、(b) manifestに属さない候補が
        household/owner/cutoff一致だけでGET/POST対象になり得る、という2つの問題が
        実DBへのprobeで確認された。
      update_paths: >-
        createReparseRunまたは個別承認されたtask 20260914-002の限定運用helperの
        SERIALIZABLE transaction内で作成する（run作成と
        同一transaction。対象候補が0件の場合は何も作成しない）。以後の更新・削除は
        行わない。
      failure_consistency: >-
        createReparseRunのSERIALIZABLE transaction内で作成されるため、
        price_reparse_runsの行作成と一方だけが確定することはない。
    - table: price_reparse_item_snapshots
      fields: [run_id, item_id, reference_price]
      meaning: >-
        2026-09-07（notice 20260907-STOCKHOME-006、task 20260907-005で追加、
        task 20260912-001で2026-09-12にproduction反映済み。同時点はschemaのみで0 row）。
        現在は元dry-runの20snapshotと、task 20260914-002でコピーした20snapshotの計40件を保持。
        run内で品目ごとに1回だけ計算・固定する「参照単価」の
        snapshot。resolveCandidatePriceForItemの層3判定（過去の確定単価との照合）が
        毎回最新の購入履歴を読むと、同一run内の処理順序・dry-run/write・chunk分割で
        判定結果が変わってしまう問題（第3回レビューB02/B06、実DBへのprobeで確認済み）を
        防ぐため、run内で最初にその品目が必要になった時点の値を固定して使い回す。
      update_paths: >-
        通常はpriceReparse.tsのgetOrCreateItemSnapshot。task 20260914-002では個別承認により、
        元dry-runの参照値を新限定runへコピーし判定を固定した。元snapshotは不変。
        通常のgetOrCreateItemSnapshotは呼び出し元のtransaction
        （dry_runでrollbackされる場合を含む）とは独立したprisma呼び出しで作成するため、
        dry_runでも実際にrowが残る。同一(run_id, item_id)への同時作成はunique制約で
        検知し、先に作成された側の値を再取得して使う。
      failure_consistency: >-
        作成のみで更新・削除は行わない（値が一度確定すれば同一run内では不変）。
        作成insertがPrisma.PrismaClientKnownRequestErrorかつcode==='P2002'
        （同一(run_id, item_id)への同時作成による真の競合）の場合だけ、既存行を
        再取得して使う。それ以外の例外（DB接続断等）は握りつぶさず再throwし、
        呼び出し元のcomputeOutcomeを含むtransaction全体をrollbackさせ、
        POST /reparse-candidatesの当該chunk全体をHTTPレベルの失敗として
        呼び出し元へ伝播させる（第5回レビューR5-04対応。以前は全例外を競合とみなし、
        再取得できなければ計算値をそのまま返してしまっていた）。
    - table: price_reparse_audit
      fields: [run_id, mode, candidate_id, purchase_id, before_*, applied_*, outcome, skip_reason]
      meaning: >-
        2026-09-06（notice 20260907-STOCKHOME-006、task 20260912-001で2026-09-12に
        production反映済み。同時点はschemaのみで0 row・HTTP書込み未発生）。現在は
        task 20260914-001のdry-run406件とtask 20260914-002のwrite193件、計599件を保持。
        過去候補の単価
        再解析batchが「正常に処理を完了した」全row（成功・skip・conflict・業務判断としての
        失敗（invalid_price_rejected等）を問わず、早期return経路も含む。第3回レビュー
        B05/B04対応、task 20260907-005で全経路を監査対象化）の変更前後値を記録する
        監査ログ。Git管理外（本テーブルのみに保存）。APIレスポンス・通常ログにはrow内容を
        一切含めない。dry_runの結果は outcome へ dry_run_ 接頭辞を付けて区別し、
        業務データ（import_order_candidates/purchase_logs）は変更しない。
        modeカラムと(run_id, candidate_id, mode)の一意制約（task 20260907-005で追加）により、
        write再送は既存行を検出して保存済み結果をそのまま返し（再判定しない）、dry_run再実行は
        同じ行へupsertする（重複行を作らない）。
        **「全row」の範囲（第4回レビューR4-01対応、task 20260907-006で明確化）**:
        DB接続断等のinfrastructure障害でcomputeOutcome実行中や監査insert自体
        （真の一意制約競合=P2002を除く）が例外を投げた場合、そのrowには監査行を作らず、
        例外を呼び出し元（POST /reparse-candidates）まで伝播させてchunk全体をHTTPレベルの
        失敗として返す。これは「業務判断としての行失敗」とは意図的に区別しており、
        GAS側はchunk全体を再送すればよい（同じrunToken・mode='write'で既に監査済みの
        候補は再判定されず、未処理の候補だけが再試行される）。
        **もう一つの例外（第7回レビューR7-02対応、task 20260907-009で明確化）**:
        受信candidateIdがrun作成時点で固定したmanifest（price_reparse_targets）の
        メンバーでない場合（`candidate_not_in_manifest`）も、意図的に監査行を
        一切作らない。これは「そもそもこのrunの業務対象外」の入力として扱うためで、
        candidate・purchase・監査のすべてが完全に不変のまま拒否される
        （第6回レビュー§13.3が指定した「manifest非所属candidateをdata/audit不変で
        拒否する」設計に合わせた。当初はこの経路でも監査行を作っていたが、
        指定と不一致だったため修正した）。
        保持期限: 自動削除する仕組みは無い（push_ticketsと異なり定期cleanup jobを設けない）。
        一度限りの過去分backfillの監査証跡であり、production反映が完了し結果がreconcile済みと
        app owner・VPS管理側が確認するまでは削除しない。
        閲覧者: VPS上での直接psql操作に限定する。API応答・ログにはrow内容を出さない。
        削除条件: 自動削除なし。将来削除する場合はapp owner・VPS管理側の合意のうえ、
        VPS上で手動SQLを実行し、削除前に対象run_idの内容をdumpとして保全する。
      update_paths: >-
        POST /api/bridge/reparse-candidates（write時: 既存監査が無ければ業務データ更新と
        同一transaction内でinsertし、同時実行でinsertが競合した場合は自分の更新を破棄して
        先に確定した側の結果を返す。dry_run時: 業務データ更新をrollbackした後、
        upsertで監査だけを独立して書く）。
      failure_consistency: >-
        write時、候補・購入の更新と監査insertは同一transaction内で行われ、
        一方だけが確定することはない（task 20260907-004対応、B05）。dry_runの監査upsertは
        独立した別transactionのため、これ自体が失敗しても業務データには影響しない。
        監査insert自体が例外を投げた場合、Prisma.PrismaClientKnownRequestErrorかつ
        code==='P2002'（同じ(run_id, candidate_id, mode)への同時insertによる真の競合）の
        ときだけ「既に別プロセスが書いた」とみなしてtransactionをrollbackし、勝者の
        保存済み結果を返す。それ以外の例外は握りつぶさず再throwし、chunk全体を
        再送可能な失敗として呼び出し元へ伝播させる（第4回レビューR4-01対応、
        task 20260907-006）。
  data_retention:
    - table: push_tickets
      policy: >-
        cleanupPushTickets関数単体は、statusがok/error（確定済み）になってから7日を
        超えたrowだけを削除対象とし、pendingは対象にしない。ただし実際の日次job
        （push_receipt_check_and_cleanup）はreceipt確認を先に実行するため、24時間を
        超えたpendingはcleanup実行前にReceiptExpired(error)へ既に閉じられている。
        したがって運用上「pendingのまま7日以上残る」ことは起こらない（B12対応、
        cleanup関数単体の挙動とjob全体の挙動を区別して記載）。
        削除件数は push_tickets_cleaned イベントでログに残す（task_id 20260902-008、
        B09対応。ローカルDBと2026-09-03のproduction定期jobで動的確認済み）。
      backup_impact: >-
        削除対象はExpoのticket ID・状態・エラーコードのみで、利用者データを含まない。
        DB全体backupには削除前の状態が残り得るが、restore後に同じ保持ポリシーが
        適用されるため運用上の問題はない。
    - table: readygo_outbox
      policy: >-
        2026-09-20（notice 20260920-STOCKHOME-014、所見A-5・A-6）追加。2026-09-21の
        第2回・第3回VPS管理レビュー（S014-B03〜B06）対応で、以下の内容へ更新した。
        statusは pending → claimed → delivered の3状態（claimed_at列を追加）。
        (1) 投入: daily_batchがキューへ投入する際、まず新規insertを試み、同一household
        の既存pending行と衝突（partial unique index違反）した場合はその行の内容をupdate
        する（削除してから作り直すのではなく、claimed行には一切触れない設計。並行実行
        （手動×手動・cron×手動）でも household当たりpending最大1件であることを、
        migration 20260920222509_readygo_outbox_claim が追加した partial unique index
        （household_id, status='pending'のみ対象）がDBレベルで保証する。production
        baselineは重複insertを許していたため、migration自体がhouseholdごとに最新1件を
        残して既存重複を整理してからindexを作成する）。update件数は
        readygo_queue_superseded イベントに出る。
        (2) claim: GET /api/bridge/readygo-pending が、単一SQL文で
        pending→claimedへ原子的に遷移させて返す（FOR UPDATE SKIP LOCKED＋status再確認
        により、並行する複数GETが同じ行を二重にclaimすることを防ぐ）。
        (3) ACK: POST /api/bridge/readygo-ack はclaimed行のみを受理しdeliveredへ遷移
        させる（pendingのまま・既にdeliveredの行はACK対象外）。
        (4) lease回収: GET呼び出しの先頭で、claimed_atから30分（GAS単体実行の上限6分に
        十分な余裕を持たせた値）を超えてclaimされたまま残る行を、household・行単位で
        個別に回収する。各行ごとに「pendingへ戻す」updateを楽観的に試み（同一household
        向けのより新しいpending行が無い前提で実行）、一意制約違反（partial unique
        indexへの違反、＝並行して新しいpending行が作られていた場合）を検知した場合の
        みその行を削除するフォールバックへ切り替える（判定してから実行するのではなく、
        DBの一意制約自体を判定として使うため、daily_batchの並行insertとの競合でも
        リクエスト全体が失敗しない。S014-B06、2026-09-21第3回VPS管理レビュー対応。
        household単位でまとめて1回のupdateで回収していた旧実装は、他householdの並行
        insertと競合すると未処理のエラーでreclaim処理全体が失敗する不具合があった）。
        pendingへ戻った行は、reclaim直後・同一呼び出し内のclaim処理で即座に再claimされ
        レスポンスにも含まれる（reclaim後にpendingのまま残る中間状態は無い）。これに
        よりGASがReadyGo投入前に停止した場合でも通知が永久に失われない。なお、この
        reclaimによって同じ行が複数回GASへ配信される可能性自体は残るが、二重の
        LINE配信を防ぐ冪等化はGAS側（ReadyGo Inboxシートへoutbox idを本文と同時書き込み
        し、既存idの再投入をスキップする。S014-B07）で行っており、本テーブル
        （API側DB）の外側の仕組みのためここには詳細を記載しない。
        (5) 保持期間: status='delivered' かつ delivered_at が30日より古い行を削除する。
        cron実行(19:55 JST)は全household、世帯を指定した手動実行はその世帯のみが対象。
        削除件数は readygo_outbox_cleaned イベントに出る。
        滞留の可視化として、job_end へ readygo_pending（pending件数）・
        readygo_pending_oldest_age_h（最古pendingの経過時間）・readygo_superseded・
        readygo_cleaned の4fieldを出す。readygo_pending_oldest_age_h が大きい値を
        取り続ける場合はGAS側の夜間トリガー停止を示すが、閾値超過時のアプリ内表示は
        所見C-3（notice 20260920-STOCKHOME-015、batch_run_status経由の別表示）で対応
        済み。ReadyGoキューの滞留そのものに対する専用の通知経路は無い。
      backup_impact: >-
        削除・上書き対象はReadyGoへ投入する集約メッセージ本文と、ACK時のnotification_log記録用の
        alerts_json（itemId・reason・1行要約）。いずれも在庫状態から翌日の夜間バッチが
        再生成できる通知キューであり、購入履歴・在庫補正等の業務データは含まない。
        配信実績そのものは notification_log 側に残る（本テーブルの削除では失われない）。
    - table: notification_logs
      policy: >-
        2026-09-20（所見C-7、notice 20260920-STOCKHOME-018）方針決定。**自動削除は
        設けない。** 通知履歴は利用者が「いつ何を通知されたか」を追跡する監査ログで、
        単一世帯・低頻度利用（アラート対象品目が新規に出た時のみ記録、日次batchの
        新規アラート件数に比例）のため増加は緩やか（開発DBで52件、2026-08末〜の
        累積）。push_tickets・readygo_outboxと異なり「同じ内容を後から再生成できる」
        性質の一時キューではなく、削除すると過去の通知実績そのものが失われるため、
        自動削除の対象にしない判断とした。
      backup_impact: 削除しないため該当なし。DB全体backupに含まれる。
      revisit_threshold: >-
        目安として10万行、またはDBサイズ・パフォーマンスに体感できる影響が
        出た場合に、保持期間ポリシーの追加を再検討する。
    - table: stock_correction_logs
      policy: >-
        2026-09-20（所見C-7、notice 20260920-STOCKHOME-018）方針決定。**自動削除は
        設けない。** 在庫補正（手動での実数入力）の履歴で、利用者が明示的に操作した
        時だけ増える（開発DBで12件）。在庫計算自体はitem_runtime_statesの現在値
        （manual_override_qty等）のみを参照し、本テーブルは表示専用の履歴のため、
        削除しても計算ロジックへの影響はないが、「なぜ今の残数になっているか」の
        説明責任を持つ監査ログとして自動削除の対象にしない判断とした。
      backup_impact: 削除しないため該当なし。DB全体backupに含まれる。
      revisit_threshold: >-
        目安として10万行、またはDBサイズ・パフォーマンスに体感できる影響が
        出た場合に、保持期間ポリシーの追加を再検討する。
    - table: import_order_candidates
      policy: >-
        2026-09-20（所見C-7、notice 20260920-STOCKHOME-018）方針決定。**自動削除は
        設けない。** Gmail自動取込の候補（開発DBで56件）。確定済み(confirmed)・
        無視済み(ignored)の候補も含め、品名部分一致による自動確定判定
        （candidateIntake.tsのprocessSingleCandidate等）や、価格の信頼性判定
        （層3判定、過去の確定単価との照合）が過去の候補データを参照するため、
        古い候補を削除すると自動確定・価格判定の精度に副作用が出る可能性がある
        （報告書原文が指摘した「学習型マッピングの入力」のリスク）。削除する場合は
        副作用の確認が必要という報告書の指摘どおり、**現時点では自動削除しない**
        判断とした。
      backup_impact: 削除しないため該当なし。DB全体backupに含まれる。
      revisit_threshold: >-
        目安として10万行、またはDBサイズ・パフォーマンスに体感できる影響が
        出た場合に、自動確定・価格判定ロジックへの影響を検証したうえで
        保持期間ポリシーの追加を再検討する。

jobs:
  - name: daily_batch
    mechanism: in-process           # OS cron/systemd-timerではなく、Node.jsプロセス内蔵の node-cron によるスケジューリング（schema既定の enum: cron|systemd-timer とは異なる実態のため、ありのまま記録）
    definition: apps/api/src/server.ts 内の node-cron スケジュール定義（コード内。OS側のcron/timerファイルは無い）
    schedule: "55 19 * * *"        # JST（node-cron の timezone: 'Asia/Tokyo' 指定）
    success_signal: >-
      構造化ログの event: job_start と job_end（同一 run_id）の対で判定できる。
      job_end.status が success/failure、job_start はあるが job_end が無ければ異常終了、
      予定時刻に job_start が無ければ未実行、と区別できる（task_id: 20260831-004 で実装、動的確認済み）。
  - name: push_receipt_check_and_cleanup
    mechanism: in-process           # daily_batch と同じnode-cron。task 20260903-001でproduction反映・動的確認済み
    definition: apps/api/src/server.ts 内の node-cron スケジュール定義（コード内）
    schedule: "10 20 * * *"        # JST。daily_batch(19:55)の送信から約15分後（Expo推奨の確認間隔に合わせる。B08対応）
    purpose: >-
      Expo Push receiptの早期確認（push_ticketsのstatusをok/errorへ確定し、DeviceNotRegistered
      端末をis_active=falseへ）と、確定済みticketの保持期限超過分の削除（B09対応）。
      daily_batch冒頭でも同じreceipt確認を実行しており（前夜分の安全網）、本scheduleは
      当夜分をExpoのreceipt保持期限(24時間)より十分前に確認するための独立実行。
      実行順序はreceipt確認が先・cleanupが後（同一job内）。24時間を超えたpendingは
      receipt確認でReceiptExpired(error)へ閉じられてから7日後に削除対象となるため、
      「pendingのまま7日以上残る」ことは実運用では起こらない（B12対応）。
    success_signal: >-
      構造化ログの event: job_start と job_end（同一run_id、job: push_receipt_check_and_cleanup）の
      対で判定できる。job_end.statusがsuccess/failure、job_startはあるがjob_endが無ければ
      異常終了、予定時刻にjob_startが無ければ未実行、と区別できる。DB例外だけでなく、
      receipt確認の最終失敗（Expo応答が無い/エラーで、retry尽きた場合）もjob自体の失敗として
      job_end.status=failureにする（「例外が無い＝成功」とはみなさない。B11対応）。
      個別のpush_receipt_check_failed warnは維持しつつ、job全体の成否をjob_start/job_endで
      判定できるようにした（task_id 20260902-009で実装、ローカルDBで動的確認済み：正常系
      success、receipt確認の最終失敗時の例外なしfailure検知、pending 0件時のsuccess、
      24時間超過pendingが同一job内でReceiptExpiredへ閉じてから即座には削除されないこと、
      の4パターンを確認。2026-09-03のproduction初回実行でも同一run_idのstart/endとsuccessを確認）。

dependencies:
  internal: []                     # 内部API依存なし（確認済み）
  external:                        # GAS（Gmail取込・ReadyGo通知）はGAS側からのアウトバウンドで本APIを呼ぶ関係であり、本APIからの外部依存ではない
    - name: expo-push-service-send
      url: https://exp.host/--/api/v2/push/send
      direction: outbound          # APIコンテナ → インターネット（HTTPS）
      used_by: daily_batch         # 夜間バッチ(19:55 JST)が「新たに在庫アラートになった品目」を検知したときのみ送信。リクエスト毎の呼び出しは無い
      auth: none                   # Expo Push Token（端末が発行する送信先識別子）を本文に載せるのみ。APIキー・secretは使用しない。
                                    # secretではないが、漏えい時は第三者が任意の通知を送信できる送信先識別子であり機微情報として扱う。
                                    # push_devicesテーブルには保存するが、ログには一切出さない（動的確認済み）
      failure_mode: >-
        1リクエストにNode 20の AbortSignal.timeout による明示的timeout(10秒)を設定し、
        429/5xx・timeout・network errorに限定して最大3回・指数backoff(500ms/1000ms)・
        1チャンク総上限30秒でretryする。それ以外の4xxは即座に諦める。すべて失敗しても
        warnログ(push_send_failed)を出してバッチ全体は失敗させない
        （task_id 20260902-007で実装、ローカルDBで動的確認済み：VPS管理レビューB03対応）。
      data_sent: >-
        通知タイトル・本文（在庫アラート対象の品目名と残日数・残数）と、宛先のExpo Push Token。
        認証情報・購入履歴・メールアドレス・世帯識別子は送らない。
        利用者が「品目名を含める」方針を選択済み（2026-09-02）。
    - name: expo-push-service-receipts
      url: https://exp.host/--/api/v2/push/getReceipts
      direction: outbound
      used_by: daily_batch         # 19:55のバッチ冒頭（前夜分の安全網）と、送信約15分後の独立scheduleの2回（B08対応）
      auth: none
      failure_mode: >-
        送信endpointと同じtimeout/retry/backoffロジックを共有する（postJsonWithRetry）。
        失敗時はwarnログ(push_receipt_check_failed)を出してバッチ全体を失敗させない
        （task_id 20260902-007で実装、ローカルDBで動的確認済み：VPS管理レビューB04対応）。
      data_sent: >-
        Expoが発行したticket ID（送信先識別子ではない）の配列のみ。応答から得るのは
        配信結果（ok/error）とExpoのエラーコード文字列のみで、push_ticketsテーブルへ保存する。
        通知本文・トークン・レスポンス全文は保存もログ出力もしない。

deploy:
  entry: npm run deploy（scripts/deploy.ps1）  # tar化 → scp → VPS上で docker compose -f docker-compose.prod.yml up -d --build api → /health ポーリング確認
  downtime: brief-restart          # api コンテナのみ再ビルド・入れ替え。postgresコンテナ・DBデータは変更しない
  rollback: >-
    正式なversioned releaseは未整備。2026-09-01のtask 20260901-001では、実行前に現行source archive、
    PostgreSQL論理dump、旧API image tagを作成し、size、gzip整合、SHA-256を確認した。task 20260901-002では、
    DB/schema/data変更がないためDB dumpを省略し、現行source archiveと旧API image tagを保全した。
    health失敗時は旧image tagをCompose overrideで起動し、成立しない場合は旧source archiveを
    別directoryへ展開して同じCompose project名で再buildする。DB schema変更はないため、通常rollbackで
    DB restoreは行わない。task 20260905-001では、旧imageを
    stockhome-api:rollback-20260905-001、旧sourceとDB dumpを
    /home/deploy/stockhome/backups/deploy-20260905-001/へ保全し、hash・restoreを確認した。
    詳細はvps-server-managementの各production実行記録を正本とする。
    task 20260912-001（API先行stage、4 migration追加）では、旧image・旧source・DB dumpを
    `/home/deploy/stockhome/backups/deploy-20260912-001/`へ保全した。第2回試行では、
    StockHome自体は正常に新imageへ入れ替わったが、無関係な別アプリのhealth check path誤りに
    より全社横断の安全機構が働き、StockHomeも含めて旧image・旧sourceへ自動rollbackされた
    （StockHome側の不具合ではない）。DBは4 migration適用済み・新規4テーブル0 rowのまま
    保持し、schema削除・DB restoreは行わなかった。第3回試行で正規のhealth pathと
    既適用schemaを開始条件として再実行し、成功した。

logging:
  destinations: [stdout]     # Docker Compose (docker-compose.prod.yml) の logging driver が収集する。アプリ独自のログファイルは無い
  format: structured          # container起動シーケンス全体を含め1行1JSONに統一済み（task_id: 20260902-001）。
                              # apps/api/Dockerfile の CMD を `node dist/entrypoint.js` へ変更し、
                              # apps/api/src/entrypoint.ts がPrisma CLI（migrate deploy）を子processとして
                              # 実行、生のstdout/stderrはログへ出さず、migration_start/migration_end
                              # （失敗時はprisma_error_codeのみ）へ変換する。成功時のみdist/server.jsを
                              # 子processとして起動し、SIGTERM/SIGINTを転送する。ローカルでDockerイメージを
                              # 実際にbuildし、成功系・失敗系・`docker stop`によるSIGTERM転送（shutdown
                              # イベントの実出力を確認）のすべてで全出力行がJSON.parse可能であることを確認済み。
  schema_version: 1           # 共通ログ規約v1準拠。container全体のstdout/stderrが1行1JSONになったことを実機（ローカルDocker）で確認済み
                              # 2026-09-05のproduction反映後も、起動・即時確認ログ13行すべてのJSON parse成功、
                              # 必須field、migration成功、failure/機微値pattern 0を確認済み
  contains_pii: false         # 実装済みの全ログ呼び出し箇所をコードレビュー・動的確認で検証: password/token/APIキー/メール本文・アドレス/メッセージID/品目名/query文字列付きURL/リクエスト・レスポンスボディを渡していない。
                              # DBエラー（Prismaエラー）はHTTPエラーハンドラで name/code のみをログへ渡し、5xxレスポンスも汎用メッセージのみを返す（task_id: 20260831-006、動的確認済み）。
                              # Prismaクライアント自身のerror/warnイベントもtarget（内部コンポーネント名）のみを渡し、message/metaは渡さない（task_id: 20260831-008、動的確認済み）。
                              # DBエラー以外（Fastify組み込み・JWT・予期しない例外）も含め、全てのエラーログ呼び出し箇所（server.ts/
                              # candidateIntake.ts/bridge.ts）を共通の許可リスト変換 safeErr()（name/文字列型codeのみ）へ統一済み
                              # （task_id: 20260831-010）。利用者値（メールアドレス・パスワード等）を含むError/非Errorでの
                              # 非混入を直接検証・実機のDB停止状態での検証の両方で確認済み。
  rotation: null              # アプリ側でローテーションを持たない（Docker/OS側に委ねる）

user_impact:
  direct_users: true           # 家庭内の利用者がモバイルアプリから直接使う
  client_apps: [stockhome-mobile]
  user_facing_functions:
    ["購入登録", "在庫予測", "在庫アラート通知（ReadyGo経由）", "在庫アラート通知（Expo Pushプッシュ通知、task 20260903-001でproduction反映・確認済み）"]

