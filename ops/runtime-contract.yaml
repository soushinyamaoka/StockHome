# 2026-08-31〜09-02 時点で解消済みの事項
resolved_gaps:
  - >-
    task_id: 20260903-001 でnotice 20260902-STOCKHOME-004をproduction反映し、2026-09-03の
    19:55 daily_batch（run_id 20260903-195500）と20:10 push_receipt_check_and_cleanup
    （run_id 20260903-201000）の初回実行を確認した。両jobともjob_start/job_endが同一run_idで
    対になりstatus success。API/DB稼働、restart count 0、health、loopback bind、DB volume、
    JSON形式、failure/機微情報非混入を確認し、定期jobのproduction動的確認不足を解消した。
  - >-
    task_id: 20260902-001 のローカルDocker検証で、正常起動中のcontainerへ`docker stop`による
    Linux SIGTERMを送り、serverの`shutdown`イベント出力、終了コード0、SIGKILL猶予前の正常終了を
    確認した。従来known_gapsに記録していたWindows開発環境由来のSIGTERM動的確認不足は解消済み。
  - >-
    task_id: 20260902-001 で解消。コンテナ起動時にPrisma CLI（`prisma migrate deploy`）・npmが
    出していた非JSON出力（1行1JSON MUST違反、`logging.format: plain`/`schema_version: null`の原因）を
    解消した。`apps/api/Dockerfile`のCMDを`node dist/entrypoint.js`へ変更し、新設した
    `apps/api/src/entrypoint.ts`がmigrationを子processとして実行して`migration_start`/
    `migration_end`（失敗時は`prisma_error_code`のみ、生出力は渡さない）へ変換し、成功時のみ
    `dist/server.js`（無変更）を子processとして起動、SIGTERM/SIGINTを転送する。ローカルで
    Dockerイメージを実際にbuildし、成功系（migration 3件・`startup`・`http_request`まで全行JSON、
    query文字列非漏洩）、失敗系（DB接続不可でP1001、`server`未起動、コンテナ非0終了、
    パスワード等の非混入）、`docker stop`によるSIGTERM転送（`shutdown`イベント実出力、
    正常終了コード0）のすべてを実機確認済み。
  - >-
    task_id: 20260901-002 でOPS-P1-08 Phase Aをproduction反映。esbuild 0.28.2、fast-uri 3.1.6、
    find-my-way 9.9.0をruntime image内で確認し、API/shared scopeのnpm auditを6件から3件へ削減した。
    API/DB、health、bind、volume、logを検証し、DB/schema/data変更がないことを確認した。
  - >-
    2026-09-01にVPS管理側がproduction実機を照合し、public URL、TLS、public health、loopback PortBinding、
    DB volume、runtime、health、loggingの現在値を確認した。verified_against_runtimeを同日へ更新した。
  - >-
    task_id: 20260831-005 で解消。Fastifyの listen() が内部的に出す "Server listening at <address>"
    （bind先アドレスごと、event: "unclassified" になっていた）を、listen()前後だけ logger level を
    一時的に silent にすることで抑制した。再起動して unclassified ログが0件になったことを確認済み。
  - >-
    task_id: 20260831-006 で解消。自動セキュリティレビューで、HTTPエラーハンドラが
    Prismaエラーの message をログとレスポンスへそのまま渡していた問題（DB制約違反等で
    利用者由来の値が漏洩し得た）を発見。DBエラーはログへ name/code のみ、5xxレスポンスは
    常に汎用メッセージのみを返すよう修正し、DB停止状態での実機確認で解消を確認済み。
  - >-
    task_id: 20260831-008 で解消。Prismaクライアント自身の内部ログが pino を経由せず
    非JSONで直接stdoutへ出力されていた問題（1行1JSON MUST違反）を発見。event購読方式へ
    変更し、target（安全な内部コンポーネント名）のみをpino経由で構造化ログ化した。
    合わせて、夜間バッチ失敗時に原因情報が皆無だった点も、安全な範囲（error_name/error_code）
    のみ job_end へ追加する形で解消。いずれもDB停止状態での実機確認で解消を確認済み。
  - >-
