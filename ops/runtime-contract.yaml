    手動付与の level フィールドが重複していた冗長な記述を削除。実機確認でキー重複が
    無くなったことを確認済み。
  - >-
    task_id: 20260831-010 で解消。server.ts の non-DB error、candidateIntake.ts、bridge.ts の
