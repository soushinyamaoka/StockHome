name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@stockhome/shared
      - run: npm run build --workspace=@stockhome/api
      - run: npx tsc --noEmit -p apps/mobile/tsconfig.json

  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockhome
          POSTGRES_PASSWORD: stockhome_ci_password
          POSTGRES_DB: stockhome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockhome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 在庫計算の「今日」は実行環境のローカル時刻に依存しており
      # （apps/api/src/services/stockCalc.ts）、productionコンテナはTZ=Asia/Tokyoで
      # 動作している。runnerの既定(UTC)のままだとJST日付境界の回帰test
      # （stockCalc.accumulation.test.tsのB08/B08-2）が日付ずれで失敗するため、
      # productionと同じ条件に揃える。
      # 所見A-10（日付生成のJST固定・TZ非依存化）の対応後に、この設定の要否を見直す。
      TZ: Asia/Tokyo
      DATABASE_URL: postgresql://stockhome:stockhome_ci_password@localhost:5432/stockhome?schema=public
      JWT_SECRET: ci-test-secret-not-for-production
      BRIDGE_TOKEN: ci-test-token-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # apps/api/package.json's test script (tsx --test "src/**/*.test.ts") relies on
          # Node.js interpreting the glob. node:test glob support arrived in Node.js v21,
          # so this test job uses Node 22 LTS while build-and-typecheck remains on Node 20.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@stockhome/shared
      - run: npm run build --workspace=@stockhome/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm test --workspace=@stockhome/api
