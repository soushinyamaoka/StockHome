# StockHome 本番用 Docker Compose（API + PostgreSQL 16）
# 使い方:
#   1) cp .env.production.example .env   して値を設定
#   2) docker compose -f docker-compose.prod.yml up -d --build
#   3) ログ確認: docker compose -f docker-compose.prod.yml logs -f api
#
# scripts/deploy.ps1 経由のdeployでは、build contextが毎回別directory
# （~/stockhome/releases/<tag>）になるため、Composeの既定の.env探索
# （--project-directory基準）に任せず、scripts/vps-deploy-runner.shが
# --env-fileで ~/stockhome/.env を明示指定する。本fileはbuild contextの
# 一部として毎回転送されるが、.envはgit管理外のため常に~/stockhome直下の
# 永続fileを参照する。
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockhome-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tokyo
    volumes:
      - stockhome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # DB はコンテナ内ネットワークのみ（ホスト/外部には公開しない）

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # commit固定tag（rollback方針、C-5対応）。API_IMAGE_TAG未指定時はlatestのまま
    # 従来どおり動作する。scripts/deploy.ps1がdeploy時に git-<40桁commit> を設定する
    image: stockhome-api:${API_IMAGE_TAG:-latest}
    container_name: stockhome-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Tokyo
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      # nginx→APIコンテナ間の直前proxy IP（A-8対応、rate limit/req.ip解決用）。
      # 未設定時はコード側の既定値(127.0.0.1,::1)にfallbackするが、Docker bridge
      # 経由のnginxからの接続はそのIPと一致しないため、本番では明示設定が必須。
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
      HISTORICAL_REPARSE_ENABLED: ${HISTORICAL_REPARSE_ENABLED}
      HISTORICAL_REPARSE_WRITE_ENABLED: ${HISTORICAL_REPARSE_WRITE_ENABLED}
    ports:
      # Nginx(HTTPS)経由のみに限定し、ホスト外部からの4002直接到達を遮断する
      # Nginxは proxy_pass http://127.0.0.1:4002 で参照する
      - "127.0.0.1:4002:4002"

volumes:
  stockhome_pgdata:
